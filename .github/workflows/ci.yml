name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ponytail: pandas + requests only. vllm/torch need a GPU and multi-GB wheels,
      # and every experiment needs assets/CVEfixes.db, which is not in the repo.
      - run: pip install pandas requests

      - name: Compile all sources
        run: python -m compileall -q .

      - name: Prompt library renders
        run: |
          python -c "
          from prompts_kat import promptS1, promptR1, promptD1
          p = promptS1('int f(){}', 'Out-of-bounds Write')
          assert 'int f(){}' in p and 'Out-of-bounds Write' in p, p
          assert promptD1('x', 'Use After Free', 'desc').count('desc') == 1
          assert 'Out-of-bounds Write' in promptR1('int f(){}', 'Out-of-bounds Write')
          "

      - name: Paired scoring is correct
        run: |
          python -c "
          import pandas as pd
          from utils import calculate_metrics
          df = pd.DataFrame({'pred_before': [1, 0, -1], 'pred_after': [1, 0, -1]})
          assert calculate_metrics(df, 'pred_before', 'pred_after') == (1, 1, 1, 1, 1, 1)
          "

      - name: Notebooks are valid JSON
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('*.ipynb')]"
